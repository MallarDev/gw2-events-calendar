name: Update GW2 character birthdays

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: gw2-calendar-update
  cancel-in-progress: false

jobs:
  update-birthdays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update character birthdays
        env:
          GW2_API_KEY: ${{ secrets.GW2_API_KEY }}
        run: python3 scripts/update_birthdays.py

      - name: Commit calendar changes
        run: |
          if git diff --quiet -- gw2-events.ics; then
            echo "No calendar changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gw2-events.ics
          git commit -m "Update GW2 character birthdays"
          git push
